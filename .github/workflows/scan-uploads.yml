name: Scan uploads

# Maintenance job. The repository is public, so its runs and logs are too: every
# step always runs, nothing is printed, and the exit code is the only signal.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

concurrency:
  group: scan-uploads
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav
          sudo systemctl stop clamav-freshclam || true
          pip install --quiet boto3 pillow cvdupdate

      # The signature database is large and the public mirrors rate-limit repeated
      # full downloads from shared runner addresses, so keep it between runs and
      # only fetch what changed. (cvdupdate, ClamAV's own mirroring tool, is used
      # instead of freshclam, which could not read a custom config on the runner.)
      - name: Date
        id: day
        run: echo "d=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore definitions
        uses: actions/cache@v4
        with:
          path: ~/clamdb
          key: clamdb-${{ steps.day.outputs.d }}
          restore-keys: |
            clamdb-

      - name: Update definitions
        run: |
          cvd config set --dbdir "$HOME/clamdb"
          # a failed update is fine if an older database is already there; with none, stop
          cvd update || test -s "$HOME/clamdb/main.cvd" -o -s "$HOME/clamdb/main.cld"

      - name: Run
        run: SCAN_CMD="clamscan --database=$HOME/clamdb" python3 .github/scripts/scan_uploads.py
